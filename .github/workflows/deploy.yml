name: Deploy to home server

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          version: latest

      - name: Load deploy-only SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust homeserver host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Run remote deploy
        # 홈서버 authorized_keys의 forced-command(deploy.sh)가 실제 실행 명령을 고정하므로
        # 여기 인자는 서버에서 무시된다. exit code만 forced-command 결과가 그대로 전달된다.
        run: |
          ssh -o BatchMode=yes "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" "${{ github.sha }}"
